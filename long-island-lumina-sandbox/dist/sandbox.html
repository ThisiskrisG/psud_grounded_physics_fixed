<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Long Island Lumina Sandbox Launcher</title>
  <style>
    html, body { margin: 0; height: 100%; background: #030712; color: white; font-family: system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header { padding: 0.75rem 1rem; background: linear-gradient(90deg, #0f172a, #14304b); border-bottom: 1px solid rgba(255,255,255,.14); }
    h1 { margin: 0; font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; }
    p { margin: .25rem 0 0; color: rgba(255,255,255,.7); font-size: .85rem; }
    iframe { width: 100%; height: 100%; border: 0; background: #030712; }
  </style>
</head>
<body>
  <header>
    <h1>Sandboxed itch.io launcher</h1>
    <p>Game runs in an iframe sandbox with scripts and pointer-lock input only.</p>
  </header>
  <iframe title="Long Island Lumina Sandbox game" src="game.html" sandbox="allow-scripts allow-pointer-lock"></iframe>
</body>
</html>
